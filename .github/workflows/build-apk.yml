name: Build TamQuocSat Android APK & Attach to Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build Signed TamQuocSat-Android.apk using Android SDK Build-Tools
        run: |
          set -e
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
          PLATFORM_JAR=$(ls $ANDROID_HOME/platforms/android-*/android.jar | sort -V | tail -n 1)
          echo "Using build-tools: $BUILD_TOOLS_DIR"
          echo "Using platform: $PLATFORM_JAR"

          mkdir -p apk_src/src/vn/tamquocsat/mobile
          mkdir -p apk_src/res/drawable
          mkdir -p apk_src/res/values
          mkdir -p apk_build/gen apk_build/obj apk_build/dex

          cp icon.png apk_src/res/drawable/ic_launcher.png

          cat << 'EOF' > apk_src/res/values/strings.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">Tam Quốc Sát</string>
          </resources>
          EOF

          cat << 'EOF' > apk_src/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="vn.tamquocsat.mobile"
              android:versionCode="120"
              android:versionName="1.2.0">
              <uses-sdk android:minSdkVersion="24" android:targetSdkVersion="34" />
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <application
                  android:label="@string/app_name"
                  android:icon="@drawable/ic_launcher"
                  android:usesCleartextTraffic="true"
                  android:hardwareAccelerated="true"
                  android:theme="@android:style/Theme.Black.NoTitleBar.Fullscreen">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="sensorLandscape"
                      android:configChanges="orientation|screenSize|keyboardHidden|smallestScreenSize|screenLayout">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > apk_src/src/vn/tamquocsat/mobile/MainActivity.java
          package vn.tamquocsat.mobile;

          import android.app.Activity;
          import android.os.Bundle;
          import android.view.View;
          import android.view.Window;
          import android.view.WindowManager;
          import android.webkit.CookieManager;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.Toast;

          public class MainActivity extends Activity {
              private WebView webView;
              private long lastBackPress = 0;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  requestWindowFeature(Window.FEATURE_NO_TITLE);
                  getWindow().setFlags(
                      WindowManager.LayoutParams.FLAG_FULLSCREEN | WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON,
                      WindowManager.LayoutParams.FLAG_FULLSCREEN | WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON
                  );
                  hideSystemUI();

                  webView = new WebView(this);
                  setContentView(webView);

                  WebSettings s = webView.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setDatabaseEnabled(true);
                  s.setAllowFileAccess(true);
                  s.setAllowContentAccess(true);
                  s.setMediaPlaybackRequiresUserGesture(false);
                  s.setLoadWithOverviewMode(true);
                  s.setUseWideViewPort(true);
                  s.setBuiltInZoomControls(false);
                  s.setDisplayZoomControls(false);
                  s.setTextZoom(100);
                  s.setCacheMode(WebSettings.LOAD_DEFAULT);

                  CookieManager.getInstance().setAcceptCookie(true);
                  CookieManager.getInstance().setAcceptThirdPartyCookies(webView, true);

                  webView.setWebViewClient(new WebViewClient());
                  webView.setWebChromeClient(new WebChromeClient());
                  webView.loadUrl("https://tqs.langcochiquy.workers.dev/?app=android");
              }

              private void hideSystemUI() {
                  View decorView = getWindow().getDecorView();
                  decorView.setSystemUiVisibility(
                      View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                      | View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                      | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                      | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                      | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                      | View.SYSTEM_UI_FLAG_FULLSCREEN
                  );
              }

              @Override
              public void onWindowFocusChanged(boolean hasFocus) {
                  super.onWindowFocusChanged(hasFocus);
                  if (hasFocus) hideSystemUI();
              }

              @Override
              public void onBackPressed() {
                  long now = System.currentTimeMillis();
                  if (now - lastBackPress > 2000) {
                      lastBackPress = now;
                      Toast.makeText(this, "Bấm Trở về lần nữa để thoát Tam Quốc Sát", Toast.LENGTH_SHORT).show();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF

          $BUILD_TOOLS_DIR/aapt package -f -m -J apk_build/gen -M apk_src/AndroidManifest.xml -S apk_src/res -I $PLATFORM_JAR
          javac -source 11 -target 11 -bootclasspath $PLATFORM_JAR -classpath $PLATFORM_JAR -d apk_build/obj apk_build/gen/vn/tamquocsat/mobile/R.java apk_src/src/vn/tamquocsat/mobile/MainActivity.java
          $BUILD_TOOLS_DIR/d8 --lib $PLATFORM_JAR --output apk_build/dex apk_build/obj/vn/tamquocsat/mobile/*.class
          $BUILD_TOOLS_DIR/aapt package -f -M apk_src/AndroidManifest.xml -S apk_src/res -I $PLATFORM_JAR -F apk_build/unaligned.apk
          cd apk_build/dex && $BUILD_TOOLS_DIR/aapt add ../unaligned.apk classes.dex && cd ../..
          $BUILD_TOOLS_DIR/zipalign -f -p 4 apk_build/unaligned.apk apk_build/aligned.apk

          keytool -genkeypair -v -keystore apk_build/release.keystore -alias tqs -keyalg RSA -keysize 2048 -validity 10000 -storepass tqs123456 -keypass tqs123456 -dname "CN=TamQuocSat, OU=Game, O=TQS, L=HN, S=HN, C=VN"
          $BUILD_TOOLS_DIR/apksigner sign --ks apk_build/release.keystore --ks-pass pass:tqs123456 --key-pass pass:tqs123456 --out TamQuocSat-Android.apk apk_build/aligned.apk
          ls -lh TamQuocSat-Android.apk

      - name: Attach TamQuocSat-Android.apk to Release v1.2.0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view v1.2.0 >/dev/null 2>&1; then
            gh release create v1.2.0 --title "Tam Quốc Sát - Bản PC & Mobile" --notes "Tải bản PC (.zip) hoặc Android (.apk) bên dưới."
          fi
          gh release upload v1.2.0 TamQuocSat-Android.apk --clobber
